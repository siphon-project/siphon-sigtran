# .github/workflows/release.yaml, publish to crates.io + GitHub Release on tag.
#
#   * verify-version, the git tag is the single source of truth; refuse to
#     publish if Cargo.toml's version doesn't match the tag.
#   * crates-io     , publish the `siphon-sigtran` crate via OIDC Trusted
#     Publishing. Idempotent: skips if the tag's version is already on crates.io.
#   * sbom          , SPDX + CycloneDX, attached to the release.
#   * github-release, notes + SBOMs.
#   * build-wheels* , the PyPI wheels for the (phase-3) Python bindings, GATED
#     behind the repo variable `PYPI_PUBLISH`. Dormant until the bindings land.
#
# NOTE: while `Cargo.toml` has `publish = false`, the crates-io job's
# `cargo publish` will refuse to run, the machinery is here so a later release
# just flips `publish` and configures Trusted Publishing. The first publish of a
# brand-new crate needs a one-shot `publish-new` token (Trusted Publishing can't
# bootstrap a crate that doesn't exist yet).
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo version must equal the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "tag=$tag_version cargo=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag ($tag_version), bump version in the release commit."
            exit 1
          fi

  crates-io:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint a short-lived crates.io token via GitHub OIDC, no stored secret
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libsctp
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev
      # Idempotent: if this tag's version is already on crates.io, skip, so
      # re-running a tag, or tagging the bootstrap release, stays green.
      - name: Already on crates.io?
        id: check
        # crates.io returns 403 to requests without a descriptive User-Agent, so
        # the -A header is mandatory (a bare curl would 403 and look "unpublished").
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ua="siphon-sigtran-release-ci (github.com/siphon-project/siphon-sigtran)"
          if curl -sf -A "$ua" "https://crates.io/api/v1/crates/siphon-sigtran/${ver}" -o /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::siphon-sigtran ${ver} already on crates.io, skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to crates.io (OIDC Trusted Publishing)
        if: steps.check.outputs.exists == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  sbom:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SPDX + CycloneDX SBOMs
        run: |
          cargo sbom --output-format spdx_json_2_3 > "siphon-sigtran-${GITHUB_REF_NAME}.spdx.json"
          cargo sbom --output-format cyclone_dx_json_1_4 > "siphon-sigtran-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            siphon-sigtran-*.spdx.json
            siphon-sigtran-*.cdx.json

  # ── PyPI wheels (phase-3 Python bindings; gated on the PYPI_PUBLISH variable) ─
  build-wheels:
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    if: vars.PYPI_PUBLISH == 'true'
    needs: verify-version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  build-sdist:
    if: vars.PYPI_PUBLISH == 'true'
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    if: vars.PYPI_PUBLISH == 'true'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mint the PyPI publish token via OIDC, no stored secret
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "sdist"
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [crates-io, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7
      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.spdx.json
            artifacts/*.cdx.json
