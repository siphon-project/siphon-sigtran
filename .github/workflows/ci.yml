# .github/workflows/ci.yml, siphon-sigtran CI.
#
# Two faces from one source tree:
#   * the pure-Rust routing brain: the default build pulls neither pyo3 nor
#     siphon-sip.
#   * the siphon extension (`--features python`): links siphon-sip + pyo3 and
#     drives the scriptable `ss7` / `gsm_map` / `gsm_cap` / `inap` namespaces end
#     to end against siphon-sip, the way siphon-smpp / siphon-http are.
#
# `--features python` links libpython (the tests boot the interpreter via pyo3's
# auto-initialize). There is no wheel, no maturin, and no `extension-module`
# feature, so `--all-features` is safe.
#
# Everything runs on GitHub-hosted runners: the repository is public, so they are
# free and unmetered, and the org's self-hosted pool is off-limits to public
# repositories anyway (its runner group sets allows_public_repositories=false,
# and opening that would let fork PRs execute on self-hosted infrastructure).
# The wire job therefore has to get kernel SCTP from the hosted image, which its
# preflight asserts rather than assumes. See the `wire` job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Toolchain-only: lint, unit/doc tests, the non-SCTP integration suites ────
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # async-sctp links against libsctp, so the dependency needs the headers to
      # build even in the jobs that never open an association.
      - name: Install libsctp
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev

      # libpython for the `--features python` build/link and the addon tests
      # that boot the interpreter.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Format
        run: cargo fmt --all -- --check

      # Lint both faces of the crate. Clippy honours [lints.clippy] in Cargo.toml
      # (correctness denied; style/dead-code warn).
      - name: Clippy (routing brain)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (siphon extension)
        run: cargo clippy --features python --all-targets -- -D warnings

      # `routing`, `wire` and `wire_python` open real SCTP associations and run in
      # the `wire` job below. Everything else needs nothing but a toolchain.
      # `abnormal` and `strict_decode` run here for their codec-level assertions;
      # their Wireshark dissection half skips without tshark and is required in
      # the `wire` job.
      # cargo refuses to mix --doc with other target selectors, hence the split.
      - name: Test (routing brain)
        run: |
          cargo test --lib --test dialogue --test abnormal --test strict_decode --test python
          cargo test --doc

      - name: Test (siphon extension, driven against siphon-sip)
        run: |
          cargo test --features python --lib --test dialogue --test abnormal --test strict_decode --test python
          cargo test --features python --doc

      - name: Benches compile
        run: cargo bench --no-run

      - name: Memory-leak check
        run: cargo run --release --example leak_check

  # ── On the wire: real kernel SCTP, and tshark as an independent dissector ────
  # These suites self-skip when SCTP or tshark is missing, which on a generic
  # runner would silently turn the whole transport layer into untested code. The
  # preflight below turns that into a hard failure instead, so this job either
  # exercises the wire or goes red; it never passes by skipping.
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # linux-modules-extra carries the sctp module on the hosted images; without
      # it modprobe has nothing to load.
      - name: Install libsctp + tshark + kernel modules
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libsctp-dev tshark "linux-modules-extra-$(uname -r)" || \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libsctp-dev tshark

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require kernel SCTP and tshark (never skip silently)
        run: |
          sudo modprobe sctp
          lsmod | grep -qE '^sctp\b' || { echo "::error::sctp kernel module not loaded; the wire suites would self-skip and pass."; exit 1; }
          command -v tshark >/dev/null || { echo "::error::tshark missing; the dissection gate would self-skip and pass."; exit 1; }

      - name: Wire tests (SCTP loopback, M3UA/M2PA/SUA, tshark gate)
        run: cargo test --test routing --test wire

      # An M2PA link against a hand-written peer: every Link Status, sequence
      # number and link test message the node sends is read back by Wireshark.
      - name: M2PA link (tshark field assertions)
        env:
          SIGTRAN_REQUIRE_TSHARK: "1"
        run: cargo test --test wire_m2pa

      # Level 3 of a transfer point against hand-written adjacent points:
      # every management message the node sends (ITU-T Q.704) is read back by
      # Wireshark.
      - name: MTP3 management (tshark field assertions)
        env:
          SIGTRAN_REQUIRE_TSHARK: "1"
        run: cargo test --test wire_mtp3

      # M3UA management against hand-written ASPs, a hand-written gateway and
      # an adjacent point: every Error, Notify and SSNM message the node sends
      # (RFC 4666) is read back by Wireshark.
      - name: M3UA management (tshark field assertions)
        env:
          SIGTRAN_REQUIRE_TSHARK: "1"
        run: cargo test --test wire_m3ua

      # Who a listening association accepts, against peers bound to loopback
      # addresses of their own: the configured peer, a stranger, a second
      # association. What the node sends to the peer it accepted is read back
      # by Wireshark.
      - name: Association identity (tshark field assertions)
        env:
          SIGTRAN_REQUIRE_TSHARK: "1"
        run: cargo test --test wire_identity

      # A client association against far ends that are absent, appear, drop
      # the association and accept again: what the node sends after it dialled
      # again (ASP Up, the Link Status exchange, the changeback declaration)
      # is read back by Wireshark.
      - name: Association redial (tshark field assertions)
        env:
          SIGTRAN_REQUIRE_TSHARK: "1"
        run: cargo test --test wire_reconnect

      # Every message the dialogue engine emits in answer to a damaged or
      # unexpected one, dissected by Wireshark with assertions on the fields.
      - name: Abnormal procedures (tshark field assertions)
        env:
          SIGTRAN_REQUIRE_TSHARK: "1"
        run: cargo test --test abnormal --test strict_decode

      - name: Wire tests (siphon extension)
        run: cargo test --features python --test wire_python --test wire_global_title

  # ── Deterministic dependency-graph policy: the PR gate ──────────────────────
  # bans / licenses / sources are a pure function of the checked-in tree, so
  # their verdict only changes when the dependency set does. That makes them
  # safe to block a PR on: a PR that pulls in a copyleft crate, a new git
  # source, or a duplicate-crate blowup fails right here, on the change that
  # introduced it, instead of surfacing weeks later.
  #
  # Time-varying RustSec advisories are deliberately NOT here. A new advisory
  # (or a yank) can land against an unchanged Cargo.lock and would turn an
  # unrelated feature PR red, so `check advisories` runs weekly + on main in
  # .github/workflows/audit.yml.
  #
  # `--locked` keeps the gate honest: deny.toml resolves with all-features, so
  # the graph includes the `python` feature's siphon-sip git dependency, and
  # without --locked cargo would re-resolve branch=main and the check would
  # drift with a repo this PR never touched.
  deny:
    name: cargo-deny (bans/licenses/sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: bans licenses sources
