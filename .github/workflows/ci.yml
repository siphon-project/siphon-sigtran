# .github/workflows/ci.yml, siphon-sigtran CI.
#
# Two faces from one source tree:
#   * the pure-Rust routing brain (crates.io): the default build pulls neither
#     pyo3 nor siphon.
#   * the siphon addon (`--features python`): links siphon-sip + pyo3 and drives
#     the scriptable `ss7` / `gsm_map` / `gsm_cap` namespaces end to end against
#     siphon-sip, the way siphon-smpp / siphon-http are.
#
# `--features python` links libpython (the tests boot the interpreter via pyo3's
# auto-initialize). There is no wheel, no maturin, and no `extension-module`
# feature, so `--all-features` is safe.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    # Self-hosted runner: unmetered CI (off the org Actions spending limit) and it
    # provides the sctp kernel module + libsctp the on-the-wire transport tests need.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # async-sctp links against libsctp; install it so the dependency builds.
      - name: Install libsctp
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev

      # SCTP kernel module for the on-the-wire transport tests.
      - name: Load SCTP module
        run: sudo modprobe sctp

      # libpython for the `--features python` build/link and the addon tests
      # that boot the interpreter.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Format
        run: cargo fmt --all -- --check

      # Lint both faces of the crate. Clippy honours [lints.clippy] in Cargo.toml
      # (correctness denied; style/dead-code warn).
      - name: Clippy (routing brain)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (siphon addon)
        run: cargo clippy --features python --all-targets -- -D warnings

      - name: Test (routing brain)
        run: cargo test

      - name: Test (siphon addon, driven against siphon-sip)
        run: cargo test --features python

      - name: Benches compile
        run: cargo bench --no-run

      - name: Memory-leak check
        run: cargo run --release --example leak_check

  # ── Deterministic dependency-graph policy: the PR gate ──────────────────────
  # bans / licenses / sources are a pure function of the checked-in tree, so
  # their verdict only changes when the dependency set does. That makes them
  # safe to block a PR on: a PR that pulls in a copyleft crate, a new git
  # source, or a duplicate-crate blowup fails right here, on the change that
  # introduced it, instead of surfacing weeks later.
  #
  # Time-varying RustSec advisories are deliberately NOT here. A new advisory
  # (or a yank) can land against an unchanged Cargo.lock and would turn an
  # unrelated feature PR red, so `check advisories` runs weekly + on main in
  # .github/workflows/audit.yml.
  #
  # `--locked` keeps the gate honest: deny.toml resolves with all-features, so
  # the graph includes the `python` feature's siphon-sip git dependency, and
  # without --locked cargo would re-resolve branch=main and the check would
  # drift with a repo this PR never touched.
  deny:
    name: cargo-deny (bans/licenses/sources)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: bans licenses sources
