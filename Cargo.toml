[package]
name = "siphon-sigtran"
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
description = "SIGTRAN/SS7 runtime: M3UA/M2PA transport, MTP3 routing, SCCP GTT, content routing, MAP/CAP termination on the published SS7 codec crates"
authors = ["SIPhon Contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/siphon-project/siphon-sigtran"
homepage = "https://github.com/siphon-project/siphon-sigtran"
keywords = ["sigtran", "ss7", "m3ua", "sccp", "routing"]
categories = ["network-programming"]
publish = false
# Operator-facing assets (docs, CI scaffolding, the leak-gate script, the Python
# example scripts) aren't part of the crate a composing siphon binary links.
exclude = [".github/", "docs/", "scripts/", "examples/*.py"]

# siphon addon: a composing siphon binary calls `python::register(py, parent)`
# at startup to mount the `ss7` / `gsm_map` / `gsm_cap` namespaces, then the
# hot-reloaded scripts program the routing tables and terminate MAP/CAP
# dialogues. There is no wheel and no PyPI package.

[dependencies]
# ── SS7 codec crates (published on crates.io) ───────────────────────────────
# Point codes + the MTP3-user SAP (routing label, availability events).
mtp3 = "1"
# M3UA (RFC 4666): IP adaptation of the MTP3-user service. Phase-2 transport.
m3ua = "1"
# M2PA (RFC 4165): MTP3 over SCTP. Phase-2 transport.
m2pa = "1"
# SCCP (Q.71x): global titles, addresses, UDT. Drives the GTT resolver.
sccp = "1"
# SUA (RFC 3868): IP adaptation of the SCCP user (TCAP) with GT/SSN/PC addressing.
# The connectionless set (CLDT/CLDR) bridges one-for-one to SCCP UDT/UDTS, so a
# `sua` Application Server routes through the same GTT / content / termination
# engine as SCCP-over-M3UA. Phase-2 transport. SCTP PPID 4.
sua = "1"
# ISUP (Q.763): circuit-switched call control, a direct MTP3-user (SI=5). Decoded
# on the transit path for the optional ISUP-aware screening layer.
itu-isup = "1"
# TCAP (Q.773): transactions + components. Decoded for content routing.
tcap = "1"
# GSM MAP (TS 29.002): operation codes + argument types (content routing view).
gsm_map = "1"
# CAMEL CAP (TS 29.078): operation codes (content routing view for SCP).
gsm_cap = "1"
# INAP CS-1 (ITU-T Q.1218 / ETSI EN 300 374-1): operation codes + argument types
# for the SSF-SCF dialogue an IN SCP terminates (a TCAP-user peer to CAP).
inap = "1"
# Async SCTP (lksctp wrapper). Pulled in now for the phase-2 transport traits.
async-sctp = "1"
# ASN.1 BER. The tcap component/dialogue API exposes `rasn` types directly (an
# Invoke parameter is a `rasn::types::Any`, an application context a
# `rasn::types::Oid`), so the dialogue engine names them to build genuine
# TCAP + MAP/CAP responses.
rasn = "0.28"

# ── config + errors ─────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

# ── async runtime (phase-2 transport; the routing brain itself is sync) ──────
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }

# ── siphon addon face (feature = "python") ───────────────────────────────────
# Kept out of the default build so `cargo add siphon-sigtran` and crates.io
# consumers of the pure-Rust routing brain pull ZERO pyo3 or siphon. Enabling
# `python` links the crate against siphon-sip and exposes the scriptable
# `ss7` / `gsm_map` / `gsm_cap` namespaces.
#
# Canonical repo URL after the siphon → siphon-sip rename. The URL string must
# match byte-for-byte across every crate that depends on siphon-sip in one build
# graph (a composing siphon binary), or cargo resolves two separate copies.
# branch=main tracks the latest lib; the consumer's Cargo.lock still pins a
# concrete SHA.
siphon-sip = { git = "https://github.com/siphon-project/siphon-sip", branch = "main", optional = true }
# pyo3 must track siphon-sip's pin (currently 0.29): both link the `python`
# native library, and cargo refuses two versions of a `links` crate in one graph.
# auto-initialize boots the interpreter for the Rust integration tests.
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }
# Bridges an async handler / an originating helper's future onto tokio, the same
# way the sibling addons (siphon-smpp, siphon-http) expose their awaitables.
pyo3-async-runtimes = { version = "0.29", optional = true, features = ["tokio-runtime"] }

[dev-dependencies]
# criterion drives the routing-brain benches (benches/routing.rs).
criterion = "0.8"

[features]
default = []
# The siphon addon face: links siphon-sip + pyo3 and compiles the `python`
# module. Used by `cargo {test,clippy} --features python`.
python = ["dep:siphon-sip", "dep:pyo3", "dep:pyo3-async-runtimes"]

[[bench]]
name = "routing"
harness = false

[lints.clippy]
# Bug-catching tier denied; style/dead-code stay at default warn (CI runs
# `cargo clippy --all-targets` and honours these levels).
correctness = { level = "deny", priority = -1 }

[package.metadata.docs.rs]
all-features = true
