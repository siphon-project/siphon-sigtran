# cargo-deny: dependency-graph security / license / source policy.
#
# The checks are split across two workflows by whether their verdict is a
# function of the tree alone:
#   * bans / licenses / sources are deterministic (they only change when the
#     dependency set changes), so .github/workflows/ci.yml gates every PR on
#     them: adding a copyleft dep, a new git source, or a duplicate-crate
#     blowup fails right there, on the PR that introduced it.
#   * advisories are time-varying (a new RustSec advisory or a yank can land
#     against an unchanged Cargo.lock), so .github/workflows/audit.yml runs
#     them weekly + on main, where a fresh finding is surfaced instead of
#     turning an unrelated feature PR red.
# Local: `cargo deny check`  ·  Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
# A yanked crate or an open RustSec advisory fails the audit.
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained (the author archived the repo), not a vulnerability:
    # it is a build-time proc-macro, so it has no runtime surface. The sole path
    # into the graph is tikv-jemalloc-ctl <- siphon-sip, which means it is
    # reachable only through the `python` feature; the default routing-brain
    # build never pulls it. Nothing to fix in this tree, so revisit when
    # tikv-jemalloc-ctl drops it.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
# siphon-sigtran links no C libraries directly (async-sctp pulls in lksctp
# behind its own build), so there is no C-FFI ban list here.

[licenses]
# The crate is MIT; keep dependencies OSI-permissive. The SS7 codec floor and
# its transitive graph (rasn, serde, tokio, ...) are MIT / Apache-2.0 / BSD /
# Unicode.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    # Permissive licenses reached only through the `python` feature's
    # siphon-sip graph (deny.toml resolves with all-features):
    #   BSL-1.0            Boost, OSI-approved  (xxhash-rust <- redis)
    #   CC0-1.0            public-domain dedication, FSF-free  (notify)
    #   CDLA-Permissive-2.0  data licence on the Mozilla CA root store, not
    #                        code  (webpki-roots <- reqwest/hyper-rustls)
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one deliberate git dependency: the `python` feature links siphon-sip from
# its canonical repo (it is not published on crates.io). Everything else must
# come from crates.io, so a new git source fails the PR gate.
allow-git = ["https://github.com/siphon-project/siphon-sip"]
